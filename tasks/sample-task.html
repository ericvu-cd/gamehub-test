<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>示範任務：老街早市尋寶</title>
<style>
    * { box-sizing: border-box; font-family: "Noto Sans TC", sans-serif; }
    body { margin: 0; min-height: 100vh; background: #FBF7EE; color: #2B2D33;
        display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; text-align: center; }
    h1 { font-size: 20px; margin-bottom: 8px; }
    p { font-size: 14px; color: #6B6F78; margin-bottom: 24px; max-width: 320px; }
    button { padding: 14px 28px; border-radius: 12px; border: none; font-size: 15px; font-weight: 700;
        cursor: pointer; margin: 6px; }
    .btn-complete { background: #34a887; color: #fff; }
    .btn-exit { background: #eee; color: #333; }
    #status { margin-top: 20px; font-size: 13px; color: #A63D40; min-height: 20px; }
</style>
</head>
<body>
    <h1>🧺 老街早市尋寶（示範）</h1>
    <p>這是一個示範任務頁面，展示如何透過 postMessage 跟平台溝通。<br>實際任務開發者可參考這份檔案的 &lt;script&gt; 部分。</p>

    <div>
        <button class="btn-complete" onclick="onTaskFinished()">模擬完成任務（+20 金幣）</button>
    </div>
    <div>
        <button class="btn-exit" onclick="onExitClick()">返回平台</button>
    </div>
    <div id="status"></div>

<script>
    // ============================================================
    // 以下為任務頁面標準整合程式碼，可直接複製到其他任務頁面使用
    // 詳見「任務頁面通訊介面規格.md」
    // ============================================================
    const PLATFORM_ORIGIN = window.location.origin; // 示範用：假設任務與平台同網域，實際請視部署情況調整
    const TASK_ID = "g1"; // 需與後台設定的任務 id 一致

    function sendToPlatform(type, payload = {}) {
        if (!window.opener) {
            document.getElementById('status').innerText = '（開發模式：未偵測到平台視窗，訊息僅印在 console）';
            console.log('[demo] sendToPlatform', type, payload);
            return;
        }
        window.opener.postMessage({
            source: "culture-task",
            version: 1,
            type,
            taskId: TASK_ID,
            payload
        }, PLATFORM_ORIGIN);
    }

    window.addEventListener("load", () => sendToPlatform("ready"));

    window.addEventListener("message", (event) => {
        if (event.origin !== PLATFORM_ORIGIN) return;
        if (event.data?.source !== "culture-platform") return;
        if (event.data.type === "ack") {
            const r = event.data.result;
            document.getElementById('status').innerText =
                `平台回覆：獲得 ${r.coinsAwarded} 金幣`;
        }
    });

    function onTaskFinished() {
        sendToPlatform("complete", { coins: 20 });
    }

    function onExitClick() {
        sendToPlatform("exit");
        window.close();
    }
</script>
</body>
</html>
