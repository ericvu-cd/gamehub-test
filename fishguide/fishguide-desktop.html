<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<title>友魚小學堂 - 桌面版</title>
<link rel="icon" href="data:,">
<style>
    html, body {
        margin: 0;
        height: 100%;
        background: #0a0a0a;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        font-family: "Microsoft JhengHei", "PingFang TC", sans-serif;
    }
    #frame-border {
        padding: 6px;
        background: #1a1a1a;
        border-radius: 32px;
        box-shadow: 0 20px 60px rgba(0,0,0,0.6);
    }
    #frame-outer {
        position: relative;
        overflow: hidden;
        border-radius: 26px;
        background: #000;
    }
    /* 跟平台及其他任務用同一組設計尺寸，整個平台的桌機展示外觀一致。 */
    #frame-outer iframe {
        display: block;
        width: 436px;
        height: 892px;
        border: 0;
        transform-origin: top left;
    }
</style>
</head>
<body>
    <div id="frame-border">
        <div id="frame-outer">
            <iframe id="frame-iframe" src="fishguide.html?embedded=1" title="友魚小學堂"></iframe>
        </div>
    </div>

    <script>
    (function () {
        var DESIGN_W = 436;
        var DESIGN_H = 892;
        var outer = document.getElementById('frame-outer');
        var iframe = document.getElementById('frame-iframe');

        function fit() {
            var availW = window.innerWidth * 0.94;
            var availH = window.innerHeight * 0.94;
            var scale = Math.min(availW / DESIGN_W, availH / DESIGN_H);

            iframe.style.transform = 'scale(' + scale + ')';
            outer.style.width = (DESIGN_W * scale) + 'px';
            outer.style.height = (DESIGN_H * scale) + 'px';
        }

        fit();
        window.addEventListener('resize', fit);

        /* 這個任務只送 exit（不送 ready/complete/score），所以實際上只有
           「iframe → 這一層 → 平台」這個方向會用到。保留 culture-platform
           那個分支只是跟其他任務的寫法一致、方便之後如果這個任務也要接
           更多功能時不用重寫這段，目前不影響任何運作。 */
        window.addEventListener('message', function (event) {
            const data = event.data;
            if (!data) return;
            if (data.source === 'culture-platform') {
                iframe.contentWindow.postMessage(data, '*');
            } else if (data.source === 'culture-task' && window.opener) {
                window.opener.postMessage(data, '*');
            }
        });
    })();
    </script>
</body>
</html>
