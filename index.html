<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>在地文化知識型互動平台</title>
<!-- PWA：應用程式說明檔、主畫面圖示、App 模式設定 -->
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0c1230">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="在地文化平台">
<script>
// 偵測 LINE 內建瀏覽器，用 LINE 官方認得的 openExternalBrowser=1 參數自動跳轉到系統瀏覽器開啟。
// 一定要放在所有其他資源（字型、CSS、Firebase）載入之前，越早跳轉越好，避免使用者在 LINE 內建
// 瀏覽器裡先看到畫面一閃、又跳走的閃爍感，也避免 Firebase 登入彈窗、window.open 任務在裡面先失敗一次。
(function () {
    var ua = navigator.userAgent;
    if (ua.indexOf('Line') > -1) {
        var url = window.location.href;
        if (url.indexOf('openExternalBrowser=1') === -1) {
            var separator = url.indexOf('?') === -1 ? '?' : '&';
            window.location.replace(url + separator + 'openExternalBrowser=1');
        }
    }
})();
</script>
<script>
    /* 電腦（寬螢幕、非觸控裝置）自動導向「手機外框」展示版（platform-desktop.html），
       手機直接開（寬度 <=700）完全不受影響、不會跳轉。
       平板（iPad、Android 平板）也算觸控裝置、不導向外框：平板的畫面寬度通常超過 700，
       如果被當成電腦導向外框，會看不到安裝畫面（安裝畫面只在最外層頁面才能運作）。
       平板上平台本身有 480px 寬度上限會置中顯示，任務則在任務視窗裡被限制成手機寬度。
       iPad 的瀏覽器預設回報成 Mac，所以另外用「Mac + 多點觸控」辨識；
       真正的 Mac 沒有多點觸控，仍然算電腦。
       跟 4 支任務不同，平台本身是「開啟者」（開任務的那一方），不是「被開啟者」。 */
    (function() {
        var params = new URLSearchParams(window.location.search);
        var inIframe = (window.self !== window.top);
        var ua = navigator.userAgent || '';
        var isTouchDevice = /Android|iPhone|iPad|iPod/.test(ua)
            || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
        if (window.innerWidth > 700 && !isTouchDevice && !inIframe && !params.has('embedded')) {
            window.location.replace('platform-desktop.html');
        }
    })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://www.gstatic.com" crossorigin>
<link rel="preconnect" href="https://identitytoolkit.googleapis.com">
<link rel="preconnect" href="https://firestore.googleapis.com">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div id="loading-screen">
        <div class="loading-spinner"></div>
        <p>連線中，請稍候...</p>
    </div>

    <div id="portrait-warning" class="portrait-warning">
        <div class="portrait-warning-icon">📱↻</div>
        <h2>請將手機轉為直式</h2>
        <p>本平台專為直式螢幕設計，以提供最佳體驗。</p>
    </div>

    <!-- 登入 / 註冊 -->
    <div id="auth-modal" class="modal-overlay">
        <div id="auth-modal-card" class="modal-card auth-mode-login">
            <div class="modal-header">
                <span id="auth-mode-badge" class="auth-mode-badge">🔑 登入模式</span>
                <h2 id="auth-title">船員報到</h2>
                <p id="auth-sub" class="modal-sub">已有船員證的船員，請在這裡登入</p>
            </div>

            <div id="auth-avatar-wrap" class="hidden">
                <p class="field-label">選擇你的頭像</p>
                <div id="avatar-picker" class="avatar-picker"></div>
            </div>

            <div class="field-group">
                <input id="auth-username" type="text" placeholder="船員名稱（中英文數字，最長20字）" class="text-input">
                <div class="password-field-wrap">
                    <input id="auth-password" type="password" placeholder="密碼（至少6碼）" class="text-input">
                    <button type="button" id="auth-password-toggle" class="password-toggle-btn hidden" onclick="window.togglePasswordVisibility()">顯示</button>
                </div>
            </div>

            <div id="auth-notice-wrap" class="hidden notice-box">
                <label class="checkbox-label">
                    <input type="checkbox" id="auth-notice-checkbox">
                    <span>我了解本平台<strong>沒有密碼救援服務</strong>，遺失密碼將無法找回，需重新註冊</span>
                </label>
            </div>

            <p id="auth-error" class="error-text hidden"></p>
            <button id="auth-submit-btn" onclick="handleAuthSubmit()" class="btn-primary">
                <span id="auth-submit-text">報到</span>
                <span id="auth-submit-spinner" class="spinner hidden"></span>
            </button>
            <p id="auth-toggle-link" class="link-text" onclick="toggleAuthMode()">還沒有船員證？點此申請加入</p>
        </div>
    </div>

    <!-- 修改密碼 -->
    <div id="pwd-modal" class="modal-overlay hidden">
        <div class="modal-card">
            <div class="modal-header"><h2>修改密碼</h2></div>
            <div class="field-group">
                <input id="pwd-current" type="password" placeholder="目前密碼" class="text-input">
                <input id="pwd-new" type="password" placeholder="新密碼（至少6碼）" class="text-input">
            </div>
            <p id="pwd-error" class="error-text hidden"></p>
            <button onclick="handleChangePassword()" class="btn-primary">更新密碼</button>
            <p class="link-text" onclick="closeChangePasswordModal()">取消</p>
        </div>
    </div>

    <!-- 徽章/證書詳情 -->
    <div id="detail-modal" class="modal-overlay hidden">
        <div class="modal-card">
            <div class="modal-header"><h2 id="detail-modal-title"></h2></div>
            <div id="detail-modal-body"></div>
            <p class="link-text" onclick="closeDetailModal()">關閉</p>
        </div>
    </div>

    <div class="brand-bar">
        <h1>在地文化知識型互動平台</h1>
    </div>

    <header class="topbar">
        <div class="user-brief" onclick="toggleUserMenu()">
            <div id="user-avatar" class="avatar-circle">🧭</div>
            <div class="user-text">
                <h1 id="user-name">尚未報到的船員</h1>
                <div id="level-progress-wrap" class="level-progress-wrap hidden">
                    <span id="user-level" class="level-badge">Lv.0</span>
                    <div class="level-progress-track">
                        <div id="level-progress-bar" class="level-progress-bar"></div>
                    </div>
                </div>
            </div>
        </div>
        <div class="coin-pill">
            <svg class="coin-icon" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
                <circle cx="12" cy="12" r="10" fill="#E8B84B" stroke="#B8863B" stroke-width="1.5"/>
                <circle cx="12" cy="12" r="6.5" fill="none" stroke="#B8863B" stroke-width="1.2" opacity="0.6"/>
                <text x="12" y="16" text-anchor="middle" font-size="10" font-weight="700" fill="#8A5A16">$</text>
            </svg>
            <span id="user-coins">0</span>
        </div>

        <div id="user-menu" class="user-menu hidden">
            <button onclick="openMyCrewCard()">我的船員證</button>
            <button id="menu-install-btn" onclick="openInstallGuide()">安裝到主畫面</button>
            <button onclick="openChangePasswordModal()">修改密碼</button>
            <button onclick="handleLogout()">登出</button>
        </div>
    </header>

    <main class="content-area">

        <section id="tab-home" class="tab-panel">
            <div class="banner-carousel">
                <div id="banner-track" class="banner-track"></div>
                <div id="banner-dots" class="banner-dots"></div>
            </div>

            <h3 class="section-label">任務清單</h3>
            <div id="task-list" class="task-list"></div>
        </section>

        <section id="tab-news" class="tab-panel hidden">
            <h2 class="page-title">公告欄</h2>
            <div id="news-list" class="news-list"></div>
        </section>

        <section id="tab-bag" class="tab-panel hidden">
            <h2 class="page-title">探索背包</h2>
            <div class="bag-section">
                <h3 class="section-label">已蒐集徽章</h3>
                <div id="badge-grid" class="collectible-grid"></div>
            </div>
            <div class="bag-section">
                <h3 class="section-label">已取得證書</h3>
                <div id="cert-grid" class="collectible-grid"></div>
            </div>
        </section>

        <section id="tab-leaderboard" class="tab-panel hidden">
            <h2 class="page-title">任務排行榜</h2>
            <select id="leaderboard-task-select" onchange="renderLeaderboard()" class="select-input"></select>
            <div id="leaderboard-list" class="leaderboard-list"></div>
        </section>

        <section id="tab-shop" class="tab-panel hidden">
            <h2 class="page-title">通行商店</h2>
            <p style="font-size:11px;color:var(--text-dim);margin:-6px 0 12px;">兌換成功後，把畫面截圖給店家看即可核銷。</p>
            <div id="shop-list" class="shop-list"></div>
        </section>

    </main>

    <nav class="bottom-nav">
        <button id="nav-home" class="nav-item tab-active" onclick="switchTab('home')">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>
            <span>任務大廳</span>
        </button>
        <button id="nav-news" class="nav-item" onclick="switchTab('news')">
            <span id="nav-news-dot" class="nav-dot hidden"></span>
            <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8"><path d="M12 3a6 6 0 0 1 6 6v4l2 4H4l2-4V9a6 6 0 0 1 6-6z"/></svg>
            <span>公告</span>
        </button>
        <button id="nav-bag" class="nav-item" onclick="switchTab('bag')">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8"><rect x="4" y="8" width="16" height="12" rx="2"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg>
            <span>背包</span>
        </button>
        <button id="nav-leaderboard" class="nav-item" onclick="switchTab('leaderboard')">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8"><path d="M8 21h8M12 17v4M7 4h10v4a5 5 0 0 1-10 0V4z"/></svg>
            <span>排行榜</span>
        </button>
        <button id="nav-shop" class="nav-item" onclick="switchTab('shop')">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8"><path d="M3 9l1.5-5h15L21 9"/><path d="M4 9h16v10a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V9z"/><path d="M9 13a3 3 0 0 0 6 0"/></svg>
            <span>商店</span>
        </button>
    </nav>

    <script type="module" src="js/main.js"></script>
</body>
</html>
